# CI del sito: a ogni PR verso main (e a ogni push su main) controlla tipi, lint, test e build.
# Nessun segreto: i test sono isolati e la build non contatta servizi esterni.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:analytics
      - run: npm run test:consultation
      - run: npm run test:research
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST000000
          NEXT_PUBLIC_CLARITY_PROJECT_ID: citest0000
